<!doctype html>
<html lang="it" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Back office — Poggio Open Cup</title>
  <meta name="theme-color" content="#1d2fe0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Black&family=Caveat+Brush&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="admin">
  <header class="topbar">
    <a href="index.html" class="brand" aria-label="Torna al sito"><img data-logo alt="Poggio Open Cup" width="32" height="32"></a>
    <div class="top-actions">
      <div id="whoami" class="whoami" hidden>
        <small id="who-role"></small>
        <strong id="who-name"></strong>
        <button id="logout" class="link-btn" type="button">Esci</button>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambia tema chiaro/scuro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
    </div>
  </header>

  <main class="page" id="view" aria-live="polite"></main>

  <nav class="dock admin-dock" id="admin-nav" aria-label="Navigazione back office" hidden>
    <button type="button" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button type="button" data-view="teams"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4m0 1h12l-2.500 4 2.500 4H6"/></svg><span>Squadre</span></button>
    <button type="button" data-view="players"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Giocatori</span></button>
    <button type="button" data-view="matches"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m12 8 3.500 2.500-1.300 4.100H9.800L8.500 10.500z"/></svg><span>Partite</span></button>
    <button type="button" data-view="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg><span>Stats</span></button>
  </nav>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
